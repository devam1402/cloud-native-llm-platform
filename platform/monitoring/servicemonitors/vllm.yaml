apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [vllm]
  selector:
    matchLabels:
      app: vllm-cpu
  endpoints:
    - port: http
      path: /metrics
      interval: 5s