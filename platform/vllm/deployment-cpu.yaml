apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu
  namespace: vllm
  labels:
    app: vllm-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cpu
  template:
    metadata:
      labels:
        app: vllm-cpu
    spec:
      initContainers:
        - name: model-loader
          image: minio/mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              mc alias set platform http://minio.minio.svc.cluster.local:9000 admin changeme-platform-2026
              mc cp --recursive platform/models/opt-125m/ /model-cache/
              echo "Model staged successfully"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      containers:
        - name: vllm
          image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.9.1
          args:
            - "--model"
            - "/model-cache"
            - "--dtype"
            - "float32"
            - "--max-model-len"
            - "1024"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      volumes:
        - name: model-cache
          emptyDir: {}