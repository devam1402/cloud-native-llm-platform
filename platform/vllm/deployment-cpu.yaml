apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu
  namespace: vllm
  labels:
    app: vllm-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cpu
  template:
    metadata:
      labels:
        app: vllm-cpu
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.9.1
          args:
            - "--model"
            - "facebook/opt-125m"
            - "--device"
            - "cpu"
            - "--dtype"
            - "float32"
            - "--max-model-len"
            - "1024"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10