apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      values: |
        mode: standalone
        replicas: 1
        rootUser: admin
        rootPassword: changeme-platform-2026
        persistence:
          enabled: true
          size: 20Gi
        resources:
          requests:
            memory: 1Gi
            cpu: 250m
        buckets:
          - name: models
            policy: none
            purge: false
          - name: benchmarks
            policy: none
            purge: false
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true